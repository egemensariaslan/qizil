<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qizil — QIR optimization report</title>
<style>/*[CSS]*/</style>
</head>
<body>
<div class="rail" aria-hidden="true"></div>
<div class="progress" id="progress" aria-hidden="true"></div>

<header class="masthead">
  <span class="wordmark">QIZIL</span>
  <code class="command" id="cmd">qizil input.ll -O3 -o optimized.ll --verify</code>
  <button class="ghost" id="theme" type="button" title="Toggle theme">
    <span id="theme-label">LIGHT</span>
  </button>
</header>

<section class="console" id="controls" hidden>
  <div class="control">
    <label for="example">Circuit</label>
    <select id="example"></select>
  </div>
  <div class="control">
    <label for="level">Level</label>
    <div class="segmented" id="level" role="radiogroup" aria-label="Optimization level"></div>
  </div>
  <div class="control">
    <label for="gateset">Gate set</label>
    <select id="gateset">
      <option value="auto">auto</option>
      <option value="strict">strict</option>
    </select>
  </div>
  <div class="control switches">
    <label class="switch"><input type="checkbox" id="phase"><span>keep global phase</span></label>
    <label class="switch"><input type="checkbox" id="verify" checked><span>verify</span></label>
  </div>
  <div class="control grow">
    <label for="file">Load module</label>
    <input type="file" id="file" accept=".ll,.txt">
  </div>
  <button id="run" class="primary" type="button">Optimize</button>
</section>

<div id="status" class="alert" hidden></div>

<main id="app" class="canvas"></main>

<footer class="colophon">
  <span id="footnote"></span>
</footer>

<script>/*[DATA]*/</script>
<script>/*[JS]*/</script>
</body>
</html>
