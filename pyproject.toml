[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qizil"
version = "0.1.0"
description = "QIR-Opt: a peephole, rotation-fusion and commutation optimizer for Quantum Intermediate Representation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Egemen", email = "sariaslanegemen@gmail.com" }]
keywords = ["qir", "quantum", "llvm", "compiler", "optimization", "clifford+t"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
# Bitcode (.bc) input/output and LLVM-level verification.
bitcode = ["pyqir>=0.10"]
# Unitary equivalence checking (`qizil verify`) and the semantic test-suite.
verify = ["numpy>=1.24"]
# Azure Quantum Resource Estimator backend for `qizil estimate --backend azure`.
azure = ["azure-quantum>=2.0"]
dev = ["pyqir>=0.10", "numpy>=1.24", "pytest>=7.0"]

[project.scripts]
qizil = "qizil.cli:main"

[project.urls]
Homepage = "https://github.com/egemen/qizil"
Issues = "https://github.com/egemen/qizil/issues"

[tool.hatch.build.targets.wheel]
packages = ["qizil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # long lines are handled by the formatter, not enforced
    "UP007",  # Optional[X] vs X | Y: both are fine on 3.10+
    "SIM108", # ternaries are not always clearer
    "B905",   # zip(strict=) is 3.10+, kept explicit where it matters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
