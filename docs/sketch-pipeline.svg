<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380">
  <title>Qizil pipeline</title>
  <desc>A module enters through the parser, becomes a Module/Function/Block/Instruction tree, is rewritten by four passes running to a fixed point (with a per-block dependency DAG feeding commutation and alias analysis), and is emitted verbatim except for what was actually rewritten.</desc>
  <style>
    .bg    { fill: #FDFCFA }
    .ink   { fill: #16161A; stroke: #16161A }
    .muted { fill: #454B59; stroke: #454B59 }
    .faint { fill: #646A78; stroke: #646A78 }
    .thin  { stroke: #454B59; stroke-width: 1.6; fill: none; stroke-linecap: round }
    .dash  { stroke: #646A78; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-dasharray: 7 6 }
    .box   { fill: #FDFCFA; stroke: #16161A; stroke-width: 1.8; }
    .box2  { fill: none; stroke: #16161A; stroke-width: 1; opacity: 0.5; }
    .accentbox { fill: none; stroke: #cf2c22; stroke-width: 1.8; }
    .chip  { fill: #FDFCFA; stroke: #454B59; stroke-width: 1.3; }
    .t     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 650; font-size: 16px; fill: #16161A; text-anchor: middle; }
    .d     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11.5px; fill: #646A78; text-anchor: middle; }
    .c     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #454B59; text-anchor: middle; }
    .lab   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #646A78; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0E1117 }
      .ink   { fill: #F2F4F8; stroke: #F2F4F8 }
      .muted { fill: #C2C8D4; stroke: #C2C8D4 }
      .faint { fill: #9AA1AE; stroke: #9AA1AE }
      .thin  { stroke: #C2C8D4 }
      .dash  { stroke: #9AA1AE }
      .box   { fill: #0E1117; stroke: #F2F4F8; }
      .box2  { stroke: #F2F4F8; }
      .accentbox { stroke: #f2453d; }
      .chip  { fill: #0E1117; stroke: #C2C8D4; }
      .t     { fill: #F2F4F8; }
      .d     { fill: #9AA1AE; }
      .c     { fill: #C2C8D4; }
      .lab   { fill: #9AA1AE; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1100" height="380"/>

  <!-- Parser -->
  <rect class="box2" x="47" y="62" width="170" height="72" rx="6" transform="rotate(-0.6 132 98)"/>
  <rect class="box" x="50" y="60" width="170" height="72" rx="6"/>
  <text class="t" x="135" y="90">Parser</text>
  <text class="d" x="135" y="110">line-oriented, text-exact</text>

  <line class="thin" x1="220" y1="96" x2="272" y2="96"/>
  <path class="thin" d="M264 89 L274 96 L264 103" fill="none"/>

  <!-- IR model -->
  <rect class="box2" x="277" y="62" width="170" height="72" rx="6" transform="rotate(0.6 362 98)"/>
  <rect class="box" x="280" y="60" width="170" height="72" rx="6"/>
  <text class="t" x="365" y="90">IR model</text>
  <text class="d" x="365" y="110">Module / Function / Block</text>

  <line class="thin" x1="450" y1="96" x2="502" y2="96"/>
  <path class="thin" d="M494 89 L504 96 L494 103" fill="none"/>

  <!-- Pass pipeline -->
  <rect class="accentbox" x="510" y="44" width="330" height="104" rx="8"/>
  <text class="t" x="675" y="68">Pass pipeline</text>
  <rect class="chip" x="522" y="85" width="72" height="26" rx="4"/>
  <text class="c" x="558" y="102">cancel</text>
  <rect class="chip" x="600" y="85" width="72" height="26" rx="4"/>
  <text class="c" x="636" y="102">merge-rot</text>
  <rect class="chip" x="678" y="85" width="72" height="26" rx="4"/>
  <text class="c" x="714" y="102">commute</text>
  <rect class="chip" x="756" y="85" width="72" height="26" rx="4"/>
  <text class="c" x="792" y="102">cliff+T</text>

  <line class="thin" x1="840" y1="96" x2="892" y2="96"/>
  <path class="thin" d="M884 89 L894 96 L884 103" fill="none"/>

  <!-- Emitter -->
  <rect class="box2" x="897" y="62" width="170" height="72" rx="6" transform="rotate(-0.6 982 98)"/>
  <rect class="box" x="900" y="60" width="170" height="72" rx="6"/>
  <text class="t" x="985" y="90">Emitter</text>
  <text class="d" x="985" y="110">verbatim unless rewritten</text>

  <!-- fixed point loop -->
  <path class="dash" d="M675 148 C 675 200, 500 200, 400 148"/>
  <path class="dash" d="M406 154 L 396 147 L 408 141" fill="none"/>
  <text class="lab" x="540" y="196">to a fixed point (&#8804; 8 rounds -O2, &#8804; 24 -O3)</text>

  <!-- BlockDag -->
  <rect class="box2" x="277" y="272" width="170" height="72" rx="6" transform="rotate(0.6 362 308)"/>
  <rect class="box" x="280" y="270" width="170" height="72" rx="6"/>
  <text class="t" x="365" y="300">BlockDag</text>
  <text class="d" x="365" y="320">qubit deps, barriers</text>

  <path class="thin" d="M420 270 C 480 230, 560 200, 640 152"/>
  <path class="thin" d="M634 160 L 644 150 L 632 146" fill="none"/>
  <text class="lab" x="560" y="238">commutation + alias analysis</text>
</svg>
